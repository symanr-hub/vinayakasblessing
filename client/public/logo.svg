  <!-- Right Leaf -->
  <path d="M50 42 C68 40 74 28 68 20 C58 20 52 32 50 42 Z" fill="#8ecc99" stroke="#ffffff" stroke-width="1.5" />
  <!-- Furrow lines (Soil Ground) -->
  <path d="M22 75 Q50 68 78 75" stroke="#bbe4c2" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M18 82 Q50 76 82 82" stroke="#8ecc99" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
